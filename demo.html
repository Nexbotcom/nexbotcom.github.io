<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Nexbot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d12; color: #f0f0f0; line-height: 1.6; }
  footer { text-align: center; padding: 30px; color: #777; font-size: 0.9rem; }
</style>
</head>
<body>

<nav style="position:sticky; top:0; background:#0d0d12; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; z-index:998; border-bottom:1px solid #222;">
  <a href="index.html" style="color:#6ee7ff; font-weight:bold; text-decoration:none;">Nexbot</a>
  <button id="menu-toggle" style="background:none; border:none; color:#f0f0f0; font-size:1.6rem; cursor:pointer;">☰</button>
</nav>

<div id="menu-panel" style="display:none; position:fixed; top:0; right:0; height:100%; width:220px; background:#1a1a2e; z-index:999; padding:60px 20px; flex-direction:column; gap:20px;">
  <span id="menu-close" style="position:absolute; top:16px; right:20px; font-size:1.5rem; cursor:pointer;">✕</span>
  <a href="index.html" style="color:#f0f0f0; text-decoration:none;">Home</a>
  <a href="pricing.html" style="color:#f0f0f0; text-decoration:none;">Pricing</a>
  <a href="demo.html" style="color:#6ee7ff; text-decoration:none; font-weight:bold;">Demo</a>
  <a href="blog.html" style="color:#f0f0f0; text-decoration:none;">Updates</a>
  <a href="contact.html" style="color:#f0f0f0; text-decoration:none;">Contact</a>
</div>

<div id="demo-section" style="max-width:500px; margin:40px auto; padding:20px;">
  <h2 style="text-align:center; color:#6ee7ff; margin-bottom:10px;">Try a Live Demo</h2>
  <p style="text-align:center; color:#bbb; margin-bottom:20px;">This simulates how an auto-reply bot responds to your customers instantly.</p>

  <div style="background:#1a1a2e; border-radius:12px; overflow:hidden;">
    <div style="background:#128C7E; color:white; padding:14px; font-weight:bold;">Nexbot Demo Assistant</div>
    <div id="chat-window" style="height:300px; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px;"></div>
    <div style="display:flex; border-top:1px solid #333;">
      <input id="chat-input" type="text" placeholder="Type a message..." style="flex:1; padding:12px; border:none; background:#0d0d12; color:white; outline:none;">
      <button onclick="sendDemoMessage()" style="background:#6ee7ff; color:#0d0d12; border:none; padding:12px 18px; font-weight:bold;">Send</button>
    </div>
  </div>
</div>

<footer>&copy; 2026 Nexbot. Built to save you time.</footer>

<script>
document.getElementById('menu-toggle').onclick = () => {
  document.getElementById('menu-panel').style.display = 'flex';
};
document.getElementById('menu-close').onclick = () => {
  document.getElementById('menu-panel').style.display = 'none';
};

function addMessage(text, sender) {
  const chatWindow = document.getElementById('chat-window');
  const bubble = document.createElement('div');
  bubble.textContent = text;
  bubble.style.padding = '10px 14px';
  bubble.style.borderRadius = '10px';
  bubble.style.maxWidth = '75%';
  bubble.style.fontSize = '0.95rem';
  if (sender === 'user') {
    bubble.style.background = '#6ee7ff';
    bubble.style.color = '#0d0d12';
    bubble.style.alignSelf = 'flex-end';
  } else {
    bubble.style.background = '#2a2a3e';
    bubble.style.color = '#fff';
    bubble.style.alignSelf = 'flex-start';
  }
  chatWindow.appendChild(bubble);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function getBotReply(msg) {
  msg = msg.toLowerCase();
  if (msg.includes('hour') || msg.includes('open')) return "We're open Mon–Sat, 9am–6pm. 😊";
  if (msg.includes('price') || msg.includes('cost')) return "Our prices start from ₦12,000 depending on what you need. Want a quote?";
  if (msg.includes('order') || msg.includes('buy')) return "Great! Tell me what you'd like to order and I'll get it sorted.";
  if (msg.includes('hello') || msg.includes('hi')) return "Hey there! 👋 How can I help you today?";
  return "Thanks for your message! We'll get back to you shortly — or ask about our hours, prices, or how to order.";
}

function sendDemoMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  setTimeout(() => addMessage(getBotReply(text), 'bot'), 600);
}

document.getElementById('chat-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendDemoMessage();
});
</script>

</body>
</html>
