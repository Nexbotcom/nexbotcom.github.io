<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updates — Nexbot</title>
 <meta name="description" content="Latest updates and news from Nexbot — new features, services, and improvements.">
<link rel="icon" type="image/png" href="grok_1788123539249.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d12; color: #f0f0f0; line-height: 1.6; }
  section { padding: 50px 20px; max-width: 800px; margin: 0 auto; }
  h2 { font-size: 1.6rem; margin-bottom: 20px; color: #6ee7ff; text-align: center; }
  .card { background: #1a1a2e; padding: 20px; border-radius: 10px; margin-bottom: 16px; }
  .card h3 { color: #fff; margin-bottom: 6px; }
  .card .date { color: #6ee7ff; font-size: 0.8rem; margin-bottom: 8px; display: block; }
  .card p { color: #bbb; font-size: 0.95rem; }
  footer { text-align: center; padding: 30px; color: #777; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="nav.js"></script>

 
<section>
  <h2>Updates</h2>
  <div id="posts-container">
    <p style="text-align:center; color:#888;">Loading updates...</p>
  </div>
</section>

<script>
async function loadPosts() {
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/posts");
    const posts = await res.json();
    const container = document.getElementById('posts-container');
    if (posts.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#888;">No updates yet.</p>';
      return;
    }
    container.innerHTML = posts.map(p => `
      <div class="card">
        <span class="date">${p.date}</span>
        <h3>${p.title}</h3>
        <p>${p.content}</p>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('posts-container').innerHTML = '<p style="text-align:center; color:#888;">Couldn\'t load updates.</p>';
  }
}
loadPosts();
</script>

<footer>&copy; 2026 Nexbot. Built to save you time.</footer>
