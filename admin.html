<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nexbot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d12; color: #f0f0f0; padding: 30px 20px; }
  h2 { color: #6ee7ff; margin-bottom: 20px; text-align: center; }
  form { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
  input, textarea { padding: 12px; border-radius: 8px; border: none; background: #1a1a2e; color: #fff; font-size: 1rem; }
  textarea { resize: vertical; }
  button { background: #6ee7ff; color: #0d0d12; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  #status { text-align: center; margin-top: 15px; }
</style>
</head>
<body>

<h2>Post a New Update</h2>
 <div style="max-width:400px; margin:0 auto 30px; text-align:center;">
  <h3 style="color:#f0f0f0; margin-bottom:10px;">Availability Status</h3>
  <button onclick="setStatus('online')" style="background:#6ee7ff; color:#0d0d12; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; margin-right:8px;">🟢 Set Online</button>
  <button onclick="setStatus('away')" style="background:#ff6b6b; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer;">🔴 Set Away</button>
  <p id="status-msg" style="margin-top:10px; color:#888;"></p>
 </div>
<form id="post-form">
  <input type="password" id="password" placeholder="Admin password" required>
  <input type="text" id="title" placeholder="Post title" required>
  <textarea id="content" placeholder="Post content" rows="5" required></textarea>
  <button type="submit">Publish</button>
</form>

 <div style="max-width:400px; margin:20px auto; text-align:center;">
  <button onclick="generateChannelPost()" style="background:#6ee7ff; color:#0d0d12; border:none; padding:10px 16px; border-radius:6px; cursor:pointer;">📢 Generate Post</button>
  <div id="preview-box" style="display:none; background:#1a1a2e; padding:15px; border-radius:8px; margin-top:15px; text-align:left;">
    <p id="preview-text" style="color:#fff; margin-bottom:12px;"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="approvePost()" style="background:#6ee7ff; color:#0d0d12; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">✅ Post </button>
      <button onclick="generateChannelPost()" style="background:#333; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">🔁 Regenerate</button>
    </div>
  </div>
  <p id="channel-post-status" style="margin-top:10px; color:#888;"></p>
 </div>
 

 <div id="posts-list" style="max-width:400px; margin:30px auto 0;">
  <h3 style="color:#f0f0f0; margin-bottom:10px;">Existing Posts</h3>
 </div>
 <button onclick="loadSubscribers()" style="display:block; margin:10px auto; background:#6ee7ff; color:#0d0d12; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Load Subscribers</button>
 
<p id="status"></p>

 <div id="subs-list" style="max-width:400px; margin:30px auto 0;">
  <h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers</h3>
 </div>
 <div id="reviews-list" style="max-width:400px; margin:30px auto 0;">
  <h3 style="color:#f0f0f0; margin-bottom:10px;">Pending Reviews</h3>
</div>
<button onclick="loadReviews()" style="display:block; margin:10px auto; background:#6ee7ff; color:#0d0d12; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Load Reviews</button>
 
<div id="subreqs-list" style="max-width:400px; margin:30px auto 0;">
  <h3 style="color:#f0f0f0; margin-bottom:10px;">Subscription Requests</h3>
</div>
<button onclick="loadSubRequests()" style="display:block; margin:10px auto; background:#6ee7ff; color:#0d0d12; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Load Subscription Requests</button>
 

<script>
document.getElementById('post-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('status');
  status.textContent = 'Publishing...';

  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/posts", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        password: document.getElementById('password').value,
        title: document.getElementById('title').value,
        content: document.getElementById('content').value
      })
    });
    const data = await res.json();
    if (data.success) {
      status.textContent = '✅ Published!';
      document.getElementById('post-form').reset();
    } else {
      status.textContent = '❌ ' + (data.error || 'Something went wrong');
    }
  } catch (err) {
    status.textContent = '❌ Error publishing';
  }
});


 
async function loadAdminPosts() {
  const container = document.getElementById('posts-list');
  container.innerHTML = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Existing Posts</h3><p style="color:#888;">Loading...</p>';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/posts");
    const posts = await res.json();
    let html = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Existing Posts</h3>';
    posts.forEach(p => {
      html += `<div style="background:#1a1a2e; padding:12px; border-radius:8px; margin-bottom:8px;">
        <strong style="color:#fff;">${p.title}</strong> <span style="color:#888; font-size:0.8rem;">(${p.id})</span>
        <button onclick="deletePost('${p.id}')" style="display:block; margin-top:8px; background:#ff6b6b; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Delete</button>
      </div>`;
    });
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<p style="color:#888;">Couldn\'t load posts.</p>';
  }
}

async function deletePost(id) {
  const password = document.getElementById('password').value;
  if (!password) { alert('Enter your password in the field above first'); return; }
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/posts", {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, id: id })
    });
    const data = await res.json();
    if (data.success) { loadAdminPosts(); } else { alert('Failed: ' + (data.error || 'unknown error')); }
  } catch (err) {
    alert('Error deleting post');
  }
}

loadAdminPosts();

 async function loadSubscribers() {
  const password = document.getElementById('password').value;
  const container = document.getElementById('subs-list');
  if (!password) {
    container.innerHTML = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers</h3><p style="color:#888;">Enter password above to view.</p>';
    return;
  }
  container.innerHTML = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers</h3><p style="color:#888;">Loading...</p>';
  try {
    const res = await fetch(`https://nexbot-proxy.chigerenzubechukwu.workers.dev/subscribers?password=${encodeURIComponent(password)}`);
    const data = await res.json();
    if (data.error) {
      container.innerHTML = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers</h3><p style="color:#888;">' + data.error + '</p>';
      return;
    }
    let html = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers (' + data.length + ')</h3>';
    data.forEach(s => {
      html += `<div style="background:#1a1a2e; padding:10px; border-radius:8px; margin-bottom:6px; color:#fff;">${s.email}</div>`;
    });
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscribers</h3><p style="color:#888;">Couldn\'t load.</p>';
  }
 }
 
async function loadReviews() {
  const password = document.getElementById('password').value;
  const container = document.getElementById('reviews-list');
  if (!password) { container.innerHTML = '<h3 style="color:#f0f0f0;">Pending Reviews</h3><p style="color:#888;">Enter password above first.</p>'; return; }
  container.innerHTML = '<h3 style="color:#f0f0f0;">Pending Reviews</h3><p style="color:#888;">Loading...</p>';
  try {
    const res = await fetch(`https://nexbot-proxy.chigerenzubechukwu.workers.dev/reviews?password=${encodeURIComponent(password)}`);
    const reviews = await res.json();
    let html = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Reviews</h3>';
    reviews.forEach(r => {
      html += `<div style="background:#1a1a2e; padding:12px; border-radius:8px; margin-bottom:8px;">
        <strong style="color:#fff;">${r.author}</strong> ${r.approved ? '<span style="color:#6ee7ff;">✅ Approved</span>' : '<span style="color:#ff6b6b;">⏳ Pending</span>'}
        <p style="color:#bbb; margin:6px 0;">${r.text}</p>
        ${!r.approved ? `<button onclick="approveReview('${r.id}')" style="background:#6ee7ff; color:#0d0d12; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Approve</button>` : ''}
      </div>`;
    });
    container.innerHTML = html || '<h3 style="color:#f0f0f0;">Reviews</h3><p style="color:#888;">No reviews yet.</p>';
  } catch (err) {
    container.innerHTML = '<h3 style="color:#f0f0f0;">Reviews</h3><p style="color:#888;">Couldn\'t load.</p>';
  }
}

async function approveReview(id) {
  const password = document.getElementById('password').value;
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/reviews/approve", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, id: id })
    });
    const data = await res.json();
    if (data.success) { loadReviews(); } else { alert('Failed: ' + (data.error || 'unknown')); }
  } catch (err) {
    alert('Error approving review');
  }
 }

 async function setStatus(status) {
  const password = document.getElementById('password').value;
  if (!password) { alert('Enter your password in the field above first'); return; }
  const msg = document.getElementById('status-msg');
  msg.textContent = 'Updating...';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/status", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, status: status })
    });
    const data = await res.json();
    msg.textContent = data.success ? '✅ Status updated to ' + status : '❌ Failed';
  } catch (err) {
    msg.textContent = '❌ Error updating status';
  }
 }

 let pendingPostText = "";

async function generateChannelPost() {
  const status = document.getElementById('channel-post-status');
  document.getElementById('preview-box').style.display = 'none';
  status.textContent = 'Generating...';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/channel-post/generate", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (data.success) {
      pendingPostText = data.post;
      document.getElementById('preview-text').textContent = data.post;
      document.getElementById('preview-box').style.display = 'block';
      status.textContent = '';
    } else {
      status.textContent = '❌ ' + (data.error || 'Failed');
    }
  } catch (err) {
    status.textContent = '❌ Error: ' + err.message;
  }
}

async function approvePost() {
  const status = document.getElementById('channel-post-status');
  status.textContent = 'Posting...';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/channel-post/send", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value, text: pendingPostText })
    });
    const data = await res.json();
    if (data.success) {
      status.textContent = '✅ Posted to channel!';
      document.getElementById('preview-box').style.display = 'none';
    } else {
      status.textContent = '❌ ' + (data.error || 'Failed');
    }
  } catch (err) {
    status.textContent = '❌ Error: ' + err.message;
  }
}

 async function loadSubRequests() {
  const password = document.getElementById('password').value;
  const container = document.getElementById('subreqs-list');
  if (!password) { container.innerHTML = '<h3 style="color:#f0f0f0;">Subscription Requests</h3><p style="color:#888;">Enter password above first.</p>'; return; }
  container.innerHTML = '<h3 style="color:#f0f0f0;">Subscription Requests</h3><p style="color:#888;">Loading...</p>';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/subscription-requests?password=" + encodeURIComponent(password));
    const reqs = await res.json();
    let html = '<h3 style="color:#f0f0f0; margin-bottom:10px;">Subscription Requests</h3>';
    if (reqs.length === 0) html += '<p style="color:#888;">None yet.</p>';
    reqs.forEach(r => {
      html += `<div style="background:#1a1a2e; padding:12px; border-radius:8px; margin-bottom:8px;">
        <strong style="color:#fff;">${r.name}</strong> — ${r.bot} (${r.duration}mo, ₦${r.price})
        <p style="color:#bbb; font-size:0.85rem; margin:4px 0;">Chat ID: ${r.chatId} | ${r.method}${r.method === 'transaction' ? ' — TXN: ' + r.transactionId + ', Name: ' + r.accountName : ' (see Telegram for screenshot)'}</p>
        ${r.approved ? `<span style="color:#6ee7ff;">✅ Active until ${new Date(r.expiryDate).toDateString()}</span>` : `<button onclick="approveSub('${r.id}')" style="background:#6ee7ff; color:#0d0d12; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Approve</button>`}
      </div>`;
    });
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<h3 style="color:#f0f0f0;">Subscription Requests</h3><p style="color:#888;">Couldn\'t load.</p>';
  }
}

async function approveSub(id) {
  const password = document.getElementById('password').value;
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/subscription-approve", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, id: id })
    });
    const data = await res.json();
    if (data.success) { loadSubRequests(); } else { alert('Failed: ' + (data.error || 'unknown')); }
  } catch (err) {
    alert('Error approving');
  }
}
 
</script>

</body>
</html>
