<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote — Nexbot</title>
 <meta name="description" content="Get an instant price estimate for Nexbot's automation bots and business websites.">
 <link rel="icon" type="image/jpeg" href="grok_1788123539249.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d12; color: #f0f0f0; line-height: 1.6; }
  section { padding: 50px 20px; max-width: 500px; margin: 0 auto; }
  h2 { font-size: 1.6rem; margin-bottom: 10px; color: #6ee7ff; text-align: center; }
  .option { background: #1a1a2e; padding: 16px; border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .option input { width: 20px; height: 20px; }
  .option label { flex: 1; color: #fff; cursor: pointer; }
  .option .price { color: #6ee7ff; font-weight: bold; }
  #total-box { background: #1a1a2e; border: 1px solid #6ee7ff; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; }
  #total-box .amount { font-size: 2rem; color: #6ee7ff; font-weight: bold; margin: 8px 0; }
  .btn { display: inline-block; background: #6ee7ff; color: #0d0d12; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
  footer { text-align: center; padding: 30px; color: #777; font-size: 0.9rem; }
</style>
</head>
<body>
 
<div id="nav-placeholder"></div>
<script src="nav.js"></script>


<section>
  <h2>Get an Instant Quote</h2>
  <p style="text-align:center; color:#bbb; margin-bottom:20px;">Select what you need — see your estimated price instantly.</p>

  <div class="option">
    <input type="checkbox" class="quote-item" data-price="15000" id="opt1">
    <label for="opt1">Auto-Reply Bot <span class="price">₦15,000</span></label>
  </div>
  <div class="option">
    <input type="checkbox" class="quote-item" data-price="12000" id="opt2">
    <label for="opt2">Business Website <span class="price">₦12,000</span></label>
  </div>
  <div class="option">
    <input type="checkbox" class="quote-item" data-price="20000" id="opt3">
    <label for="opt3">Booking / Order Bot <span class="price">₦20,000</span></label>
  </div>
  <div class="option">
    <input type="checkbox" class="quote-item" data-price="0" id="opt4">
    <label for="opt4">Custom Automation <span class="price">Free quote</span></label>
  </div>

  <div id="total-box">
    <p style="color:#bbb;">Estimated Total</p>
    <p class="amount" id="quote-total">₦0</p>
    <a href="contact.html" id="quote-cta" class="btn">Message Us on WhatsApp</a>
  </div>
</section>

<footer>&copy; 2026 Nexbot. Built to save you time.</footer>

<script>
document.getElementById('menu-toggle').onclick = () => {
  document.getElementById('menu-panel').style.display = 'flex';
};
document.getElementById('menu-close').onclick = () => {
  document.getElementById('menu-panel').style.display = 'none';
};

function updateQuote() {
  let total = 0;
  let hasCustom = false;
  document.querySelectorAll('.quote-item').forEach(item => {
    if (item.checked) {
      const price = parseInt(item.dataset.price);
      if (price === 0) hasCustom = true;
      total += price;
    }
  });
  document.getElementById('quote-total').textContent = '₦' + total.toLocaleString() + (hasCustom ? '+' : '');
}

document.querySelectorAll('.quote-item').forEach(item => {
  item.addEventListener('change', updateQuote);
});
</script>

</body>
</html>
