<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Nexbot</title>
<link rel="icon" type="image/png" href="grok_1788123539249.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d12; color: #f0f0f0; line-height: 1.6; }
  .btn { display: inline-block; background: #6ee7ff; color: #0d0d12; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  section { padding: 50px 20px; max-width: 800px; margin: 0 auto; }
  h2 { font-size: 1.6rem; margin-bottom: 20px; color: #6ee7ff; text-align: center; }
  footer { text-align: center; padding: 30px; color: #777; font-size: 0.9rem; }
</style>
</head>
<body>

<nav style="position:sticky; top:0; background:#0d0d12; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; z-index:998; border-bottom:1px solid #222;">
  <a href="index.html" style="color:#6ee7ff; font-weight:bold; text-decoration:none;">Nexbot</a>
  <button id="menu-toggle" style="background:none; border:none; color:#f0f0f0; font-size:1.6rem; cursor:pointer;">☰</button>
</nav>

<div id="menu-panel" style="display:none; position:fixed; top:0; right:0; height:100%; width:220px; background:#1a1a2e; z-index:999; padding:60px 20px; flex-direction:column; gap:20px;">
  <span id="menu-close" style="position:absolute; top:16px; right:20px; font-size:1.5rem; cursor:pointer;">✕</span>
  <a href="index.html" style="color:#f0f0f0; text-decoration:none;">Home</a>
  <a href="pricing.html" style="color:#f0f0f0; text-decoration:none;">Pricing</a>
  <a href="demo.html" style="color:#f0f0f0; text-decoration:none;">Demo</a>
  <a href="blog.html" style="color:#f0f0f0; text-decoration:none;">Updates</a>
  <a href="contact.html" style="color:#6ee7ff; text-decoration:none; font-weight:bold;">Contact</a>
</div>

<section id="contact">
  <h2>Get In Touch</h2>
  <p style="text-align:center; color:#bbb;">Message us directly — we'll get back to you fast.</p>
  <p style="text-align:center; margin-top:15px;">
    <a href="https://wa.me/+2349157677407" class="btn">Chat on WhatsApp</a>
  </p>
  <div style="max-width:400px; margin:30px auto 0;">
    <h3 style="text-align:center; color:#f0f0f0; margin-bottom:15px; font-size:1.1rem;">Or send us a message</h3>
    <form action="https://formspree.io/f/xgaevglq" method="POST" style="display:flex; flex-direction:column; gap:12px;">
      <input type="text" name="name" placeholder="Your name" required style="padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff;">
      <input type="email" name="email" placeholder="Your email" required style="padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff;">
      <textarea name="message" placeholder="What do you need?" required rows="4" style="padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff; resize:vertical;"></textarea>
      <button type="submit" style="background:#6ee7ff; color:#0d0d12; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">Send Message</button>
    </form>
  </div>

 <div style="max-width:400px; margin:30px auto 0;">
    <h3 style="text-align:center; color:#f0f0f0; margin-bottom:15px; font-size:1.1rem;">Are you a client? Leave a review</h3>
    <form id="review-form" style="display:flex; flex-direction:column; gap:12px;">
      <input type="text" id="review-author" placeholder="Your name / business" required style="padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff;">
      <textarea id="review-text" placeholder="Your experience with Nexbot" required rows="4" style="padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff; resize:vertical;"></textarea>
      <button type="submit" style="background:#6ee7ff; color:#0d0d12; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">Submit Review</button>
    </form>
    <p id="review-status" style="text-align:center; margin-top:10px; color:#6ee7ff;"></p>
 </div>

 
</section>

 

 <section>
  <h2>Stay Updated</h2>
  <p style="text-align:center; color:#bbb; margin-bottom:15px;">Get notified when we launch new features and services.</p>
  <form id="newsletter-form" style="display:flex; gap:10px; max-width:400px; margin:0 auto; flex-wrap:wrap; justify-content:center;">
    <input id="newsletter-email" type="email" placeholder="Your email" required style="flex:1; min-width:200px; padding:12px; border-radius:8px; border:none; background:#1a1a2e; color:#fff;">
    <button type="submit" style="background:#6ee7ff; color:#0d0d12; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">Subscribe</button>
  </form>
  <p id="newsletter-status" style="text-align:center; margin-top:10px; color:#6ee7ff;"></p>
 </section>

<footer>&copy; 2026 Nexbot. Built to save you time.</footer>

<script>
document.getElementById('menu-toggle').onclick = () => {
  document.getElementById('menu-panel').style.display = 'flex';
};
document.getElementById('menu-close').onclick = () => {
  document.getElementById('menu-panel').style.display = 'none';
};

 document.getElementById('newsletter-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('newsletter-email').value;
  const status = document.getElementById('newsletter-status');
  status.textContent = 'Subscribing...';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/subscribe", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    const data = await res.json();
    if (data.success) {
      status.textContent = '✅ Subscribed! We\'ll keep you updated.';
      document.getElementById('newsletter-form').reset();
    } else {
      status.textContent = '❌ ' + (data.error || 'Something went wrong');
    }
  } catch (err) {
    status.textContent = '❌ Error subscribing';
  }
});

 document.getElementById('review-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('review-status');
  status.textContent = 'Submitting...';
  try {
    const res = await fetch("https://nexbot-proxy.chigerenzubechukwu.workers.dev/reviews", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        author: document.getElementById('review-author').value,
        text: document.getElementById('review-text').value
      })
    });
    const data = await res.json();
    if (data.success) {
      status.textContent = '✅ Thank you! Your review will appear after approval.';
      document.getElementById('review-form').reset();
    } else {
      status.textContent = '❌ ' + (data.error || 'Something went wrong');
    }
  } catch (err) {
    status.textContent = '❌ Error submitting review';
  }
});
 
</script>

</body>
</html>
